name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exercise the Mastra/engines.node floor plus the current LTS release.
        node-version: [22.13.0, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm pack --dry-run

  zod-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zod-version: [3.25.76, 4.4.3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - run: npm install --no-save @mastra/core@1.56.0 zod@${{ matrix.zod-version }}

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
